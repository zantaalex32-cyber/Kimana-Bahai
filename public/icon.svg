<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean rounded icon canvas -->
  <rect width="512" height="512" rx="112" fill="#f8fafc" />

  <g transform="translate(256, 256)" filter="url(#subtleShadow)">
    <!-- Outer Colorful Sectors -->
    <!-- Purple Sector (Top-Right: ~270 to 330 deg) -->
    <path d="M 0 -170 A 170 170 0 0 1 147 -85 L 95 -55 A 110 110 0 0 0 0 -110 Z" fill="#6339a8" />
    
    <!-- Light Green Sector (Right: ~330 to 30 deg) -->
    <path d="M 147 -85 A 170 170 0 0 1 147 85 L 95 55 A 110 110 0 0 0 95 -55 Z" fill="#8bc34a" />
    
    <!-- Bottom Red Sector (~30 to 90 deg) -->
    <path d="M 147 85 A 170 170 0 0 1 0 170 L 0 110 A 110 110 0 0 0 95 55 Z" fill="#e53935" />
    
    <!-- Orange Sector (~90 to 150 deg) -->
    <path d="M 0 170 A 170 170 0 0 1 -147 85 L -95 55 A 110 110 0 0 0 0 110 Z" fill="#fb8c00" />
    
    <!-- Yellow Sector (~150 to 210 deg) -->
    <path d="M -147 85 A 170 170 0 0 1 -147 -85 L -95 -55 A 110 110 0 0 0 -95 55 Z" fill="#fbc02d" />
    
    <!-- Sky Blue Sector (~210 to 270 deg) -->
    <path d="M -147 -85 A 170 170 0 0 1 0 -170 L 0 -110 A 110 110 0 0 0 -95 -55 Z" fill="#42a5f5" />

    <!-- Concentric Crisp White Ring -->
    <circle cx="0" cy="0" r="110" fill="#ffffff" />

    <!-- Central Red Disc and Q-style Stem -->
    <!-- Stem extending down-right -->
    <rect x="25" y="25" width="48" height="120" rx="14" fill="#e53935" transform="rotate(-45 49 85)" />
    <!-- Center Red Disc -->
    <circle cx="0" cy="0" r="66" fill="#e53935" />
  </g>
</svg>

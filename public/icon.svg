<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base with Rounded Corner App Frame -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" />
  
  <!-- Sunrise Glow -->
  <circle cx="256" cy="190" r="180" fill="url(#sunGlow)" />

  <!-- Sunrise Rays -->
  <g stroke="#fef08a" stroke-width="3" stroke-opacity="0.35">
    <line x1="256" y1="180" x2="60" y2="40" />
    <line x1="256" y1="180" x2="256" y2="20" />
    <line x1="256" y1="180" x2="452" y2="40" />
    <line x1="256" y1="180" x2="490" y2="140" />
    <line x1="256" y1="180" x2="22" y2="140" />
  </g>

  <!-- Kilimanjaro Mountain Silhouette -->
  <!-- Outer Mountain Base -->
  <path d="M40 440 L190 260 L256 250 L320 270 L472 440 Z" fill="#042f2e" />
  <!-- Snow Cap -->
  <path d="M210 256 L240 248 L270 249 L295 258 L305 278 L280 290 L260 272 L240 285 L220 275 Z" fill="#ffffff" fill-opacity="0.95" />
  <!-- Foreground Ridge -->
  <path d="M120 440 L230 320 L280 325 L392 440 Z" fill="#065f46" fill-opacity="0.7" />

  <!-- Radiant Nine-Pointed Star -->
  <g transform="translate(256, 150) scale(5.5)">
    <!-- 9 points -->
    <path d="M 0 -16 L 3.5 -5 L 0 0 L -3.5 -5 Z" fill="url(#goldGrad)" transform="rotate(0)" />
    <path d="M 0 -16 L 3.5 -5 L 0 0 L -3.5 -5 Z" fill="url(#goldGrad)" transform="rotate(40)" />
    <path d="M 0 -16 L 3.5 -5 L 0 0 L -3.5 -5 Z" fill="url(#goldGrad)" transform="rotate(80)" />
    <path d="M 0 -16 L 3.5 -5 L 0 0 L -3.5 -5 Z" fill="url(#goldGrad)" transform="rotate(120)" />
    <path d="M 0 -16 L 3.5 -5 L 0 0 L -3.5 -5 Z" fill="url(#goldGrad)" transform="rotate(160)" />
    <path d="M 0 -16 L 3.5 -5 L 0 0 L -3.5 -5 Z" fill="url(#goldGrad)" transform="rotate(200)" />
    <path d="M 0 -16 L 3.5 -5 L 0 0 L -3.5 -5 Z" fill="url(#goldGrad)" transform="rotate(240)" />
    <path d="M 0 -16 L 3.5 -5 L 0 0 L -3.5 -5 Z" fill="url(#goldGrad)" transform="rotate(280)" />
    <path d="M 0 -16 L 3.5 -5 L 0 0 L -3.5 -5 Z" fill="url(#goldGrad)" transform="rotate(320)" />
    <circle cx="0" cy="0" r="3.5" fill="#fef08a" />
  </g>
</svg>
